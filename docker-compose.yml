services:
  todo.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:80
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=123456
    container_name: todo.api
    image: todo.api
    build:
      context: .
      dockerfile: TodoAPI/Dockerfile
    ports:
      - "44361:80"
    volumes:
      - ~/.aspnet/https:/https:ro
    depends_on: 
      database.server:
        condition: service_healthy
  
  database.server:
    container_name: database.server
    image: "mcr.microsoft.com/mssql/server"
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Super_Password123
    
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P "Super_Password123" -Q "SELECT 1" -C -b -o /dev/null
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
      
  todo.client:
    build:
      context: TodoAPI/Client
      dockerfile: Dockerfile
    image: todo.client
    container_name: todo.client
    ports:
      - "5173:5173"
    depends_on:
      - todo.api